<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #050f17;
        color: #fff;
        font-family: 'Segoe UI Variable Display', 'Segoe UI', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #06131c;
      }
      .a {
        position: absolute;
      }
      .scene {
        position: absolute;
        inset: 0;
        perspective: 2400px;
      }
      .blob {
        position: absolute;
        width: 1500px;
        height: 1500px;
        border-radius: 50%;
      }
      .dots {
        position: absolute;
        inset: 0;
        opacity: 0.5;
        background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1.5px, transparent 1.6px);
        background-size: 48px 48px;
      }
      .vig {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.5) 100%);
      }
      .h1 {
        font-size: 84px;
        font-weight: 800;
        letter-spacing: -2.5px;
        line-height: 1.04;
        white-space: nowrap;
      }
      .h1 .w {
        display: inline-block;
      }
      .h1 .ac {
        color: #2dd4bf;
      }
      .sub {
        font-size: 33px;
        font-weight: 400;
        color: #a9c1cf;
        letter-spacing: -0.2px;
        white-space: nowrap;
      }
      .wm {
        font-weight: 800;
        letter-spacing: -3px;
        line-height: 1;
        white-space: nowrap;
      }
      .wm span {
        font-weight: 300;
        color: #7fe0d0;
      }
      .win {
        position: absolute;
        background: #f7f9fb;
        border-radius: 22px;
        overflow: hidden;
        color: #162c3f;
        box-shadow:
          0 50px 120px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.14);
      }
      .bar {
        height: 52px;
        background: #e9eef3;
        display: flex;
        align-items: center;
        padding: 0 22px;
        gap: 9px;
        border-bottom: 1px solid #d9e1e8;
      }
      .bar i {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #c5d1db;
        display: block;
      }
      .bar .url {
        margin-left: 22px;
        background: #fff;
        border-radius: 99px;
        padding: 6px 22px;
        font-size: 14px;
        color: #657789;
      }
      .body {
        position: relative;
      }
      .paper {
        position: absolute;
        background: #fff;
        border-radius: 6px;
        box-shadow:
          0 18px 50px rgba(0, 0, 0, 0.28),
          0 2px 6px rgba(0, 0, 0, 0.12);
        overflow: visible;
      }
      .fld {
        position: absolute;
        border: 2px solid #14b8a0;
        background: rgba(20, 184, 160, 0.13);
        border-radius: 6px;
        color: #0d3b3a;
        font-size: 17px;
        font-weight: 600;
        display: flex;
        align-items: center;
        padding: 0 10px;
        white-space: nowrap;
      }
      .fld .tag {
        position: absolute;
        left: -2px;
        top: -22px;
        background: #087e70;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 5px 5px 5px 0;
        letter-spacing: 0.3px;
      }
      .card {
        position: absolute;
        background: #fff;
        border-radius: 16px;
        border: 1px solid #e0e8ee;
        box-shadow: 0 6px 18px rgba(22, 44, 63, 0.08);
        overflow: hidden;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 99px;
        font-weight: 700;
      }
      .btn {
        position: absolute;
        background: #087e70;
        color: #fff;
        border-radius: 12px;
        font-weight: 700;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 8px 20px rgba(8, 126, 112, 0.35);
      }
      .glass {
        position: absolute;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 22px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
      }
      .ripple {
        position: absolute;
        width: 60px;
        height: 60px;
        margin: -30px 0 0 -30px;
        border-radius: 50%;
        border: 3px solid #2dd4bf;
      }
      .cursor {
        position: absolute;
        left: 0;
        top: 0;
        width: 34px;
        height: 34px;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.45));
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script>
      const LANG = new URLSearchParams(location.search).get('lang') || 'fr';
      const L = (fr, en) => (LANG === 'fr' ? fr : en);
      const CUES = [];
      let OFF = 0;
      const cue = (type, t, vol = 1, pan = 0) => CUES.push({ type, t: t + OFF, vol, pan });
      const panOf = (x) => Math.max(-0.6, Math.min(0.6, (x - 960) / 1600));

      const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const ease = {
        lin: (t) => t,
        out: (t) => 1 - (1 - t) ** 3,
        io: (t) => (t < 0.5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2),
        back: (t) => 1 + 2.9 * (t - 1) ** 3 + 1.9 * (t - 1) ** 2,
      };
      const pr = (t, s, d, e = ease.out) => e(cl((t - s) / d));
      const lerp = (a, b, k) => a + (b - a) * k;

      function put(e, o) {
        const { x = 0, y = 0, s = 1, r = 0, rx = 0, ry = 0 } = o;
        e.style.transform = `translate(${x}px,${y}px) rotateX(${rx}deg) rotateY(${ry}deg) rotate(${r}deg) scale(${s})`;
        if (o.o !== undefined) {
          e.style.opacity = o.o;
          e.style.visibility = o.o <= 0.003 ? 'hidden' : 'visible';
        }
        if (o.b !== undefined) e.style.filter = o.b > 0.15 ? `blur(${o.b}px)` : 'none';
      }
      // pop-in with overshoot: element scales up and fades in at time s
      function pop(e, t, s, d = 0.55, o = {}) {
        const k = pr(t, s, d, ease.back),
          f = pr(t, s, d * 0.6);
        put(e, {
          x: o.x || 0,
          y: (1 - f) * (o.y ?? 24) + (o.dy || 0),
          s: lerp(o.from ?? 0.82, 1, k) * (o.scale || 1),
          r: o.r || 0,
          rx: o.rx || 0,
          ry: o.ry || 0,
          o: f,
        });
      }
      function mk(parent, cls, html, css) {
        const d = document.createElement('div');
        d.className = 'a ' + (cls || '');
        if (html) d.innerHTML = html;
        if (css) d.style.cssText = css;
        parent.appendChild(d);
        return d;
      }
      function kf(t, keys) {
        if (t <= keys[0][0]) return [keys[0][1], keys[0][2]];
        for (let i = 1; i < keys.length; i++) {
          if (t <= keys[i][0]) {
            const a = keys[i - 1],
              b = keys[i],
              k = ease.io(cl((t - a[0]) / (b[0] - a[0])));
            return [lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
          }
        }
        const l = keys[keys.length - 1];
        return [l[1], l[2]];
      }

      let uid = 0;
      const LOGO = (s = 64) => {
        const g = 'lg' + uid++;
        return `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><defs><linearGradient id="${g}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#087e70"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#${g})"/><path d="M20 12h17l10 10v28a3 3 0 0 1-3 3H20a3 3 0 0 1-3-3V15a3 3 0 0 1 3-3z" fill="#fff"/><path d="M37 12v10h10z" fill="#b6ece3"/><rect x="23" y="29" width="18" height="4.5" rx="2.2" fill="#087e70"/><rect x="23" y="38" width="12" height="4.5" rx="2.2" fill="#7fd9cc"/></svg>`;
      };
      const P = {
        text: '<path d="M5 6V4h14v2M12 4v16M9 20h6"/>',
        date: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
        list: '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
        check: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/>',
        tick: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
        folder:
          '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
        search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
        lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
        mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
        dl: '<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
        zip: '<rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M12 3v6M10 6h4M10 9h4"/><rect x="9.5" y="12" width="5" height="5" rx="1.2"/>',
        plus: '<path d="M12 5v14M5 12h14"/>',
        shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
        user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
        pdf: '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/>',
      };
      const I = (n, size = 22, color = 'currentColor', sw = 2) =>
        `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;

      function paperEl(parent, w, h, seed = 0, css = '') {
        const e = mk(parent, 'paper', '', `width:${w}px;height:${h}px;${css}`);
        const pad = w * 0.09;
        let s = `<div style="position:absolute;left:${pad}px;top:${pad}px;width:${w * 0.42}px;height:${Math.max(6, w * 0.035)}px;border-radius:99px;background:#9fb3c2"></div>`;
        const lh = Math.max(4, w * 0.022),
          gap = lh * 2.2;
        let y = pad * 2 + w * 0.07,
          i = 0;
        while (y < h - pad - lh) {
          const wd = [0.82, 0.72, 0.9, 0.55, 0.78, 0.66, 0.85][(i + seed) % 7];
          s += `<div style="position:absolute;left:${pad}px;top:${y}px;width:${(w - pad * 2) * wd}px;height:${lh}px;border-radius:99px;background:#e3e9ef"></div>`;
          y += gap;
          i++;
        }
        e.innerHTML = s;
        return e;
      }
      function fieldEl(paper, x, y, w, h, tag, text = '') {
        const f = mk(
          paper,
          'fld',
          (tag ? `<span class="tag">${tag}</span>` : '') + `<span class="ft">${text}</span>`,
          `left:${x}px;top:${y}px;width:${w}px;height:${h}px`,
        );
        return f;
      }
      function win(parent, x, y, w, h, url) {
        const d = mk(
          parent,
          'win',
          `<div class="bar"><i></i><i></i><i></i><div class="url">${url}</div></div>`,
          `left:${x}px;top:${y}px;width:${w}px;height:${h}px`,
        );
        const body = document.createElement('div');
        body.className = 'body';
        body.style.height = h - 52 + 'px';
        d.appendChild(body);
        d.body = body;
        return d;
      }
      function head(r, lines, sub, o = {}) {
        const h = mk(r, 'h1', '', `left:140px;top:${o.top ?? 112}px;font-size:${o.size ?? 84}px`);
        const ws = [];
        lines.forEach((line, li) => {
          const d = document.createElement('div');
          line.split(' ').forEach((w, i) => {
            const s = document.createElement('span');
            s.className =
              'w' + ((lines.length > 1 ? li === lines.length - 1 : i >= 1) ? ' ac' : '');
            s.textContent = w + ' ';
            d.appendChild(s);
            ws.push(s);
          });
          h.appendChild(d);
        });
        const sb = mk(r, 'sub', sub, `left:143px;top:${o.subTop ?? 232}px;${o.subCss || ''}`);
        return { ws, sb };
      }
      function revealHead(hd, t, s = 0.15) {
        hd.ws.forEach((w, i) => {
          const k = pr(t, s + i * 0.1, 0.65);
          put(w, { y: (1 - k) * 46, o: k, b: (1 - k) * 12 });
        });
        const k = pr(t, s + hd.ws.length * 0.1 + 0.1, 0.6);
        put(hd.sb, { y: (1 - k) * 20, o: k });
      }
      function typer(span, str, ts, cps, pan = 0) {
        for (let i = 0; i < str.length; i++)
          if (str[i] !== ' ') cue('tick', ts + i / cps, 0.55, pan);
        return (t) => {
          const n = Math.floor(cl((t - ts) * cps, 0, str.length));
          span.textContent = str.slice(0, n);
          return n;
        };
      }
      const CURSOR_SVG =
        '<svg viewBox="0 0 34 34" width="34" height="34"><path d="M5 3l22 11-9 3-4 10z" fill="#fff" stroke="#0b1a26" stroke-width="2" stroke-linejoin="round"/></svg>';
      function mkCursor(r, keys, clicks) {
        const cur = mk(r, 'cursor', CURSOR_SVG);
        const rips = clicks.map((c) => {
          const [x, y] = kf(c, keys);
          cue('click', c, 0.8, panOf(x));
          const e = mk(r, 'ripple', '', `left:${x}px;top:${y}px`);
          return { e, c };
        });
        return (t) => {
          const [x, y] = kf(t, keys);
          const o = pr(t, keys[0][0] - 0.3, 0.3) * (1 - pr(t, keys[keys.length - 1][0] + 0.1, 0.3));
          let sq = 1;
          clicks.forEach((c) => {
            const d = t - c;
            if (d > 0 && d < 0.16) sq = 0.82;
          });
          put(cur, { x, y, s: sq, o });
          rips.forEach(({ e, c }) => {
            const k = cl((t - c) / 0.55);
            put(e, { s: 0.3 + k * 1.5, o: t >= c && k < 1 ? (1 - k) * 0.9 : 0 });
          });
          return [x, y];
        };
      }

      const scenes = [];
      function scene(start, end, build, update) {
        const root = mk(document.getElementById('stage'), 'scene', '', '');
        OFF = start;
        const ctx = build(root);
        OFF = 0;
        scenes.push({ start, end, root, update, ctx });
        if (start > 0) cue('whoosh', start - 0.32, 0.9);
      }

      const stage = document.getElementById('stage');
      const bg = mk(
        stage,
        '',
        '',
        'inset:0;background:linear-gradient(135deg,#06131c 0%,#0a2230 55%,#08262b 100%)',
      );
      const blobs = [
        mk(
          stage,
          'blob',
          '',
          'background:radial-gradient(circle,rgba(20,184,160,.30),transparent 62%)',
        ),
        mk(
          stage,
          'blob',
          '',
          'background:radial-gradient(circle,rgba(56,120,220,.22),transparent 62%)',
        ),
        mk(
          stage,
          'blob',
          '',
          'background:radial-gradient(circle,rgba(20,184,160,.16),transparent 62%)',
        ),
      ];
      mk(stage, 'dots');
      const header = mk(
        stage,
        '',
        `<div style="display:flex;align-items:center;gap:14px">${LOGO(46)}<div class="wm" style="font-size:30px;letter-spacing:-1px">GED <span>By DZ</span></div></div>`,
        'left:140px;top:40px',
      );
      const progress = mk(
        stage,
        '',
        '',
        'left:140px;top:1036px;width:1640px;height:4px;display:flex;gap:10px',
      );
      const segs = [];
      for (let i = 0; i < 7; i++) {
        const sgm = document.createElement('div');
        sgm.style.cssText =
          'flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.12);position:relative;overflow:hidden';
        sgm.innerHTML =
          '<div style="position:absolute;left:0;top:0;bottom:0;background:#2dd4bf;width:0"></div>';
        progress.appendChild(sgm);
        segs.push(sgm.firstChild);
      }
      const WX = 160,
        WY = 340; // main window origin (stage px)

      // ============ SCENE 1 — hook (0–8)
      scene(
        0,
        8,
        (r) => {
          const intro = mk(
            r,
            '',
            `<div style="display:flex;align-items:center;gap:30px">${LOGO(150)}<div class="wm" style="font-size:118px">GED <span>By DZ</span></div></div>`,
            'inset:0;display:flex;align-items:center;justify-content:center',
          );
          const hd = head(
            r,
            [L('Vos PDF.', 'Your PDFs.'), L('Devenus formulaires.', 'Become forms.')],
            L(
              'Créez, remplissez et générez vos documents en quelques clics.',
              'Create, fill in and generate your documents in a few clicks.',
            ),
            { top: 330, size: 96, subTop: 585 },
          );
          const PX = 1230,
            PY = 180,
            PW = 440,
            PH = 622;
          const rig = mk(
            r,
            '',
            '',
            `left:${PX}px;top:${PY}px;width:${PW}px;height:${PH}px;transform-style:preserve-3d`,
          );
          const back2 = paperEl(rig, PW, PH, 2, 'opacity:.35');
          const back1 = paperEl(rig, PW, PH, 4, 'opacity:.6');
          const front = paperEl(rig, PW, PH, 0);
          const tagPdf = mk(
            front,
            '',
            'PDF',
            'right:24px;top:24px;background:#e8f1ee;color:#087e70;font-weight:800;font-size:15px;padding:5px 12px;border-radius:8px',
          );
          const flds = [
            [40, 130, 260, 42, L('Nom', 'Name'), 'Aa'],
            [40, 215, 180, 42, 'Date', '28/10'],
            [40, 300, 42, 42, L('Case', 'Box'), '✓'],
            [40, 385, 350, 42, L('Signature', 'Signature'), ''],
          ].map(([x, y, w, h, tag, tx]) => fieldEl(front, x, y, w, h, tag, tx));
          const fTimes = flds.map((f, i) => {
            const y = [130, 215, 300, 385][i];
            const t = 3.2 + ((y - 60) / 500) * 1.8;
            cue('pop', t, 0.7, 0.25);
            return t;
          });
          cue('shimmer', 5.1, 0.8, 0.2);
          const scan = mk(
            front,
            '',
            '',
            `left:-20px;width:${PW + 40}px;height:5px;border-radius:3px;background:linear-gradient(90deg,transparent,#2dd4bf,transparent);box-shadow:0 0 30px 8px rgba(45,212,191,.6)`,
          );
          const ready = mk(
            r,
            'pill',
            `${I('tick', 26, '#06131c', 3)} ${L('Formulaire prêt', 'Form ready')}`,
            `left:${PX + 60}px;top:900px;background:#2dd4bf;color:#06131c;padding:14px 26px;font-size:24px`,
          );
          cue('chime', 5.4, 0.7, 0.3);
          cue('boom', 0.35, 0.9);
          cue('whoosh', 1.75, 0.8);
          const chips = [
            mk(
              r,
              'pill',
              'PDF',
              `left:1100px;top:250px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);padding:10px 20px;font-size:22px`,
            ),
          ];
          return { intro, hd, rig, back1, back2, front, flds, fTimes, scan, ready, chips, PH };
        },
        (t, c) => {
          const k = pr(t, 0.2, 0.9, ease.back);
          const out = pr(t, 1.7, 0.7, ease.io);
          put(c.intro, {
            s: lerp(0.7, 1, k) * (1 + out * 0.25),
            o: pr(t, 0.2, 0.5) * (1 - out),
            b: out * 14,
          });
          revealHead(c.hd, t, 2.3);
          const kk = pr(t, 2.0, 1.1, ease.out);
          const fl = Math.sin(t * 1.3) * 7;
          put(c.rig, { x: (1 - kk) * 200, y: fl, ry: -22 + (1 - kk) * 25, rx: 8, r: 2, o: kk });
          put(c.back1, { x: 26, y: 26 });
          put(c.back2, { x: 52, y: 52 });
          const sy = 60 + 500 * cl((t - 3.2) / 1.8);
          put(c.scan, { y: sy, o: t > 3.2 && t < 5.0 ? 1 : 0 });
          c.flds.forEach((f, i) => pop(f, t, c.fTimes[i], 0.5, { y: 0, from: 0.6 }));
          pop(c.ready, t, 5.4, 0.6, { y: 30 });
          put(c.chips[0], { o: pr(t, 2.6, 0.6) * (1 - pr(t, 4.8, 0.5)), x: pr(t, 2.6, 0.8) * 40 });
        },
      );

      // ============ SCENE 2 — import & organise (8–16)
      scene(
        8,
        16,
        (r) => {
          const hd = head(
            r,
            [L('Importez. Organisez.', 'Import. Organize.')],
            L('Vos modèles, classés par dossier.', 'Your templates, sorted into folders.'),
          );
          const w = win(r, WX, WY, 1600, 660, L('ged.local / modèles', 'ged.local / templates'));
          const B = w.body;
          mk(
            B,
            '',
            '',
            'left:0;top:0;width:280px;height:608px;background:#eef2f6;border-right:1px solid #dde5ec',
          );
          mk(
            B,
            '',
            L('Dossiers', 'Folders'),
